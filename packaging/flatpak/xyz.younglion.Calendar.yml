app-id: xyz.younglion.Calendar
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: CalendarApp
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: libical
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DICAL_GLIB=OFF
      - -DICAL_BUILD_DOCS=OFF
      - -DLIBICAL_BUILD_TESTING=OFF
      - -DWITH_CXX_BINDINGS=OFF
    sources:
      - type: archive
        url: https://codeload.github.com/libical/libical/tar.gz/refs/tags/v3.0.20
        sha256: e73de92f5a6ce84c1b00306446b290a2b08cdf0a80988eca0a2c9d5c3510b4c2
  - name: younglion-calendar
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ../..
